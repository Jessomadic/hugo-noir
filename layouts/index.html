{{ define "main" }}

  <div class="surface-card article-card">
    <h1 class="section-title">{{ $author.name }}</h1>
    <p class="hero-role">{{ $author.role }}</p>
    <div class="resume-prose article-content">{{ .Content }}</div>
  </div>
</div>
{{ end }}
