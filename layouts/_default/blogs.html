{{ define "main" }}
{{ $blogsData := index site.Data .Language.Lang "blogs" }}
<div class="site-shell detail-page">
  <h1 class="section-title">{{ .Title }}</h1>
  <div class="simple-list">
    {{ range $blogsData.blogs }}
    <article class="simple-list-item">
      {{ with .date }}<p class="card-label">{{ . }}</p>{{ end }}
      <h2><a href="{{ .link }}" class="text-link" target="_blank" rel="noopener noreferrer">{{ .title }}</a></h2>
      <p>{{ .summary }}</p>
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
