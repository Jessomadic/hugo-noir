{{ define "main" }}
<div class="site-shell">
  <article class="surface-card p-6 md:p-8">
    <h1 class="section-title mb-4 text-text-primary-light dark:text-text-primary-dark">{{ .Title }}</h1>
    {{ if eq .Section "blogs" }}
    <div class="mb-8 flex flex-wrap items-center gap-3 muted-copy">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ range .Params.tags }}
      <span class="tag-pill">{{ . }}</span>
      {{ end }}
    </div>
    {{ end }}
    <div class="resume-prose">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
