{{ define "main" }}
<article class="site-shell detail-page">
  <div class="surface-card article-card">
    <h1 class="section-title">{{ .Title }}</h1>
    {{ if eq .Section "blogs" }}
      <time class="article-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    {{ end }}
    <div class="resume-prose article-content">{{ .Content }}</div>
  </div>
</article>
{{ end }}
