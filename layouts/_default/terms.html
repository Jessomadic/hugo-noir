{{ define "main" }}
<div class="site-shell detail-page">
  <h1 class="section-title">{{ .Title }}</h1>
  <ul class="term-list">
    {{ range .Data.Terms.ByCount }}
    <li><a href="{{ .Page.RelPermalink }}" class="text-link">{{ .Page.Title }}</a> <span>({{ .Count }})</span></li>
    {{ end }}
  </ul>
</div>
{{ end }}
