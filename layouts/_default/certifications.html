{{ define "main" }}
<div class="site-shell detail-page">
  <h1 class="section-title centered-heading">{{ .Title }}</h1>
  <div class="certification-intro resume-prose">{{ .Content }}</div>

  <section class="credential-section" aria-labelledby="certifications-heading">
    <h2 id="certifications-heading" class="subsection-title">Certifications</h2>
    <div class="credential-grid">
      {{ range .Site.Params.certifications }}
      <article class="surface-card credential-card">
        <h3>{{ .title }}</h3>
        <p>{{ .issuer }}</p>
      </article>
      {{ end }}
    </div>
  </section>

  <section class="credential-section" aria-labelledby="training-heading">
    <h2 id="training-heading" class="subsection-title">Training</h2>
    <div class="credential-grid">
      {{ range .Site.Params.training }}
      <article class="surface-card credential-card">
        <h3>{{ .title }}</h3>
        <p>{{ .issuer }}</p>
      </article>
      {{ end }}
    </div>
  </section>
</div>
{{ end }}
