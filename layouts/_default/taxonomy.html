{{ define "main" }}
<div class="site-shell detail-page">
  <h1 class="section-title">{{ .Title }}</h1>
  <div class="simple-list">
    {{ range .Pages }}
    <article class="surface-card simple-list-card">
      <h2><a href="{{ .RelPermalink }}" class="text-link">{{ .Title }}</a></h2>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
