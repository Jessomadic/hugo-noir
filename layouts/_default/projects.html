{{ define "main" }}
{{ $projectsData := index site.Data .Language.Lang "projects" }}
<div class="site-shell detail-page">
  <h1 class="section-title">{{ .Title }}</h1>
  <div class="surface-card page-intro resume-prose">{{ .Content }}</div>

  <div class="project-grid project-index-grid">
    {{ range $projectsData.projects }}
      {{ partial "project-card.html" (dict "project" . "headingLevel" 2) }}
    {{ end }}
  </div>
</div>
{{ end }}
