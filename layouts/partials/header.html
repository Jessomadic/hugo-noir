{{ $author := index site.Data .Language.Lang "author" }}
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <div class="mx-auto flex w-full max-w-6xl items-center justify-between gap-4 px-4 py-5">
    <a href="{{ "/" | relLangURL }}" class="brand-mark" aria-label="Jesse Copas home">
      <span class="brand-name">{{ $author.name }}</span>
    </a>

    <nav class="hidden items-center gap-5 lg:flex" aria-label="Primary navigation">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL | relLangURL }}" class="nav-link {{ if or ($.Page.IsMenuCurrent "main" .) ($.Page.HasMenuCurrent "main" .) }}is-active{{ end }}">
        {{ .Name }}
      </a>
      {{ end }}
    </nav>

    <div class="header-utilities flex items-center gap-3">
      <p class="local-time hidden xl:block" title="Eastern Time">
        Rochester · <time data-local-time>Eastern Time</time>
      </p>

      <div class="header-socials hidden items-center gap-2 md:flex" aria-label="Social links">
        <a href="{{ $author.social.github }}" class="icon-button" target="_blank" rel="noopener noreferrer" aria-label="Jesse Copas on GitHub">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.419 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.866-.014-1.7-2.782.604-3.369-1.342-3.369-1.342-.455-1.157-1.11-1.465-1.11-1.465-.908-.62.069-.608.069-.608 1.004.071 1.532 1.031 1.532 1.031.892 1.529 2.341 1.087 2.91.831.091-.646.349-1.087.635-1.337-2.221-.253-4.555-1.111-4.555-4.944 0-1.092.39-1.985 1.03-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.563 9.563 0 0 1 12 6.831a9.6 9.6 0 0 1 2.504.337c1.909-1.294 2.748-1.025 2.748-1.025.545 1.377.202 2.394.099 2.647.641.698 1.029 1.591 1.029 2.683 0 3.842-2.337 4.688-4.565 4.936.359.309.678.92.678 1.855 0 1.337-.012 2.418-.012 2.747 0 .268.18.579.688.481A10.003 10.003 0 0 0 22 12c0-5.523-4.477-10-10-10Z"/></svg>
        </a>
        <a href="{{ $author.social.linkedin }}" class="icon-button" target="_blank" rel="noopener noreferrer" aria-label="Jesse Copas on LinkedIn">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.47 2H3.53a1.45 1.45 0 0 0-1.47 1.43v17.14A1.45 1.45 0 0 0 3.53 22h16.94a1.45 1.45 0 0 0 1.47-1.43V3.43A1.45 1.45 0 0 0 20.47 2ZM8.09 18.74h-3v-9h3ZM6.59 8.48a1.56 1.56 0 1 1 0-3.12 1.57 1.57 0 1 1 0 3.12Zm12.32 10.26h-3v-4.83c0-1.21-.43-2-1.52-2A1.65 1.65 0 0 0 12.85 13a2 2 0 0 0-.1.73v5h-3v-9h3V11a3 3 0 0 1 2.71-1.5c2 0 3.45 1.29 3.45 4.06Z"/></svg>
        </a>
      </div>

      <button data-theme-toggle class="icon-button" type="button" aria-label="Toggle color theme">
        <svg data-theme-dark-icon width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21.7519 15.0021C20.597 15.484 19.3296 15.7501 18 15.7501C12.6152 15.7501 8.25 11.3849 8.25 6.00011C8.25 4.67052 8.51614 3.40308 8.99806 2.24817C5.47566 3.71798 3 7.19493 3 11.2501C3 16.6349 7.36522 21.0001 12.75 21.0001C16.8052 21.0001 20.2821 18.5245 21.7519 15.0021Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg data-theme-light-icon class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" stroke="currentColor" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
      </button>
      <button id="mobile-menu-button" class="icon-button lg:hidden" type="button" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>

  <div id="mobile-menu" class="fixed inset-0 z-50 hidden bg-bg-primary-light/95 backdrop-blur-xl dark:bg-bg-primary-dark/95" aria-hidden="true">
    <div class="flex h-full flex-col">
      <div class="flex items-center justify-between p-6">
        <a href="{{ "/" | relLangURL }}" class="brand-name text-text-primary-light dark:text-text-primary-dark" data-menu-link>{{ $author.name }}</a>
        <div class="flex items-center gap-2">
          <button data-theme-toggle class="icon-button" type="button" aria-label="Toggle color theme">
            <svg data-theme-dark-icon width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21.7519 15.0021C20.597 15.484 19.3296 15.7501 18 15.7501C12.6152 15.7501 8.25 11.3849 8.25 6.00011C8.25 4.67052 8.51614 3.40308 8.99806 2.24817C5.47566 3.71798 3 7.19493 3 11.2501C3 16.6349 7.36522 21.0001 12.75 21.0001C16.8052 21.0001 20.2821 18.5245 21.7519 15.0021Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg data-theme-light-icon class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" stroke="currentColor" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
          </button>
          <button id="mobile-menu-close" class="icon-button" type="button" aria-label="Close menu">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <nav class="flex flex-col gap-2 p-6" aria-label="Mobile navigation">
        {{ range .Site.Menus.main }}
        <a href="{{ .URL | relLangURL }}" class="mobile-nav-link" data-menu-link>{{ .Name }}</a>
        {{ end }}
      </nav>
      <div class="mt-auto border-t border-border-secondary-light p-6 dark:border-border-secondary-dark">
        <p class="local-time" title="Eastern Time">Rochester · <time data-local-time>Eastern Time</time></p>
        <div class="header-socials mt-4 flex items-center gap-4">
          <a href="{{ $author.social.github }}" class="text-link" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="{{ $author.social.linkedin }}" class="text-link" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="mailto:{{ $author.social.email }}" class="text-link">Email</a>
        </div>
      </div>
    </div>
  </div>
</header>
