<li class="carousel-item">
  {{ if eq .type "image" }}
  <img src="{{ .icon | relURL }}" alt="" class="skill-img-icon" aria-hidden="true">
  {{ else if eq .type "svg" }}
  <span class="skill-img-icon" aria-hidden="true">{{ .icon | safeHTML }}</span>
  {{ end }}
  <span class="skill-name-text">{{ .name }}</span>
</li>
