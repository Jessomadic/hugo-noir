<article class="project-card">
  <div class="project-media">
    {{ with .image }}
    <img src="{{ . | relURL }}" alt="{{ $.title }}" class="project-image">
    {{ end }}
  </div>
  <div class="project-body">
    <h3 class="text-2xl font-bold text-text-primary-light dark:text-text-primary-dark">{{ .title }}</h3>
    <div class="mt-3 flex flex-wrap gap-2">
      {{ range split .tech "," }}
      <span class="tag-pill">{{ strings.TrimSpace . }}</span>
      {{ end }}
    </div>
    <p class="mt-4 leading-relaxed muted-copy">{{ .description }}</p>
    {{ with .link }}
    <a href="{{ . }}" class="mt-5 inline-flex text-link" target="_blank" rel="noopener noreferrer">{{ T "learnMore" }}</a>
    {{ else }}
    {{ if .internal }}
    <span class="mt-5 inline-flex tag-pill">Internal Project</span>
    {{ end }}
    {{ end }}
  </div>
</article>
