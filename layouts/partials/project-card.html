<article class="project-story additional-project-story{{ if not .image }} project-story--text-only{{ end }}{{ if eq .imageFit "contain" }} project-story--media-contain{{ end }}{{ if .imagePadding }} project-story--media-padded{{ end }}">
  {{ with .image }}
  <a class="project-story-media" href="{{ $.link }}" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-hidden="true">
    <img src="{{ . | relURL }}" alt="" loading="lazy">
  </a>
  {{ end }}
  <div class="project-story-copy">
    <p class="plain-label">{{ .category }}</p>
    <h3>{{ .title }}</h3>
    <p>{{ .description }}</p>
    <p class="project-tech">{{ .tech }}</p>
    {{ with .link }}
    <a href="{{ . }}" class="text-link" target="_blank" rel="noopener noreferrer">Open the project</a>
    {{ else }}
    {{ if .internal }}<span class="project-private">Internal project · no client data or code published</span>{{ end }}
    {{ end }}
  </div>
</article>
