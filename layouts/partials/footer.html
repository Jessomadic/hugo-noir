{{ $author := index site.Data .Language.Lang "author" }}
<footer class="mt-24">
  <div class="mx-auto w-full max-w-6xl px-4 pb-10">
    <div class="flex flex-col justify-between gap-4 border-t border-border-primary-light pt-6 text-sm text-text-secondary-light dark:border-border-primary-dark dark:text-text-secondary-dark md:flex-row md:items-center">
      <div>
        <p class="font-bold text-text-primary-light dark:text-text-primary-dark">{{ $author.name }}</p>
        <p class="mt-1 font-mono text-xs">Systems Administrator &amp; Infrastructure Engineer · Rochester, NY</p>
      </div>
      <div class="flex flex-wrap gap-4 font-mono text-xs">
        <a href="{{ "resume/" | relLangURL }}" class="text-link">Résumé</a>
        <a href="{{ $author.social.linkedin }}" target="_blank" rel="noopener noreferrer" class="text-link">LinkedIn</a>
        <a href="{{ $author.social.github }}" target="_blank" rel="noopener noreferrer" class="text-link">GitHub</a>
        <span>&copy; {{ now.Format "2006" }} Jesse Copas</span>
      </div>
    </div>
  </div>
</footer>
