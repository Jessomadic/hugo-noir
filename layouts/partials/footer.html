{{ $author := index site.Data .Language.Lang "author" }}
<footer class="site-footer">
  <div class="footer-inner">
    <p>&copy; {{ now.Format "2006" }} {{ $author.name }}</p>
    <p>
      Built using <a href="https://gohugo.io/" target="_blank" rel="noopener noreferrer" class="animated-link">Hugo</a>.
      Take a look at my <a href="{{ $author.social.github }}" target="_blank" rel="noopener noreferrer" class="animated-link">GitHub</a>.
    </p>
    <nav class="footer-nav" aria-label="Footer navigation">
      <a href="{{ "contact/" | relLangURL }}" class="text-link">Contact</a>
      <a href="{{ "resume/" | relLangURL }}" class="text-link">HTML résumé</a>
      <a href="{{ .Site.Params.resume_pdf | relURL }}" class="text-link" download>Download PDF</a>
    </nav>
  </div>
</footer>
